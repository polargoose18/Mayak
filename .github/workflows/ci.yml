name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The runner image is pinned: ubuntu-latest moves to a new Ubuntu release on 19 October 2026.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check
      - run: make sign-check
      # Warning only: an expiring targets list must not block unrelated PRs.
      - run: make targets-expiry
        continue-on-error: true
      - run: go test -race ./...
      # Run as a pinned version, not added to go.mod. Raise the version by hand.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

  # Only on release tags: a release must not carry the test key.
  release-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make release-check
